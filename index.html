<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UK Sort Code Checker | Instant Lookup Tool</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      text-align: center;
      background: #fafafa;
      color: #222;
      padding: 0 15px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    .input-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    input {
      width: 55px;
      padding: 10px;
      font-size: 16px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      background: white;
    }

    input.filled {
      border-color: #4a90e2;
      box-shadow: 0 0 4px rgba(74,144,226,0.3);
    }

    button {
      padding: 10px 18px;
      font-size: 15px;
      margin: 12px 5px 0 5px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #4a90e2;
      color: white;
    }

    button:hover {
      background: #3a7ac0;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #result {
      margin-top: 30px;
    }

    .card {
      border: 1px solid #ddd;
      background: white;
      padding: 18px;
      margin-top: 20px;
      border-radius: 10px;
      text-align: left;
      display: inline-block;
      min-width: 300px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .bank {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .label {
      font-weight: bold;
    }

    .error {
      color: #a94442;
      margin-top: 20px;
    }

    .suggestion {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }

  </style>

</head>

<body>

<h1>UK Sort Code Checker</h1>
<div class="subtitle">Instant bank, branch and location lookup</div>

<p>Enter a 6-digit sort code</p>

<div class="input-box">
  <input id="part1" maxlength="2" inputmode="numeric" placeholder="12">
  <span>-</span>
  <input id="part2" maxlength="2" inputmode="numeric" placeholder="34">
  <span>-</span>
  <input id="part3" maxlength="2" inputmode="numeric" placeholder="56">
</div>

<br>

<button id="searchBtn" onclick="lookup()">Search</button>
<button onclick="clearAll()">Clear</button>

<div id="result"></div>

<script>

let data = [];

fetch('sortcodes.csv')
  .then(r => r.text())
  .then(text => {
    const rows = text.split('\n').slice(1);

    data = rows.map(row => {
      const cols = row.split(',');

      return {
        sort_code: (cols[0] || "").trim(),
        bank: (cols[1] || "").trim(),
        branch: (cols[2] || "").trim(),
        location: (cols[3] || "").trim()
      };
    });
  });

function normalise(input) {
  return input.replace(/[^0-9]/g, "");
}

function formatSortCode(code) {
  return code.slice(0,2) + "-" + code.slice(2,4) + "-" + code.slice(4,6);
}

function lookup() {

  const result = document.getElementById("result");
  const btn = document.getElementById("searchBtn");

  result.innerHTML = "Searching...";
  btn.disabled = true;

  const raw = [
    document.getElementById("part1").value,
    document.getElementById("part2").value,
    document.getElementById("part3").value
  ].join("");

  const cleaned = normalise(raw);

  if (cleaned.length !== 6) {
    result.innerHTML = `<div class="error">Please enter a full 6-digit sort code.</div>`;
    btn.disabled = false;
    return;
  }

  const formatted = formatSortCode(cleaned);

  let match = data.find(d => d.sort_code === formatted);

  if (match) {
    result.innerHTML = `
      <div class="card">
        <div class="bank">${match.bank}</div>
        <div><span class="label">Branch:</span> ${match.branch}</div>
        <div><span class="label">Location:</span> ${match.location}</div>
      </div>
    `;
  } else {

    // fallback suggestions
    const suggestions = data
      .filter(d => d.sort_code.startsWith(cleaned.slice(0,2)))
      .slice(0,3);

    let html = `<div class="error"><strong>No exact match found</strong></div>`;

    if (suggestions.length) {
      html += `<div class="suggestion"><strong>Similar results:</strong><br>`;

      suggestions.forEach(s => {
        html += `${s.sort_code} — ${s.bank}<br>`;
      });

      html += `</div>`;
    }

    result.innerHTML = html;
  }

  btn.disabled = false;
}

function clearAll() {
  document.getElementById("part1").value = "";
  document.getElementById("part2").value = "";
  document.getElementById("part3").value = "";
  document.getElementById("result").innerHTML = "";
}

</script>

</body>
</html>
