<!DOCTYPE html>
<html>
<head>
  <title>UK Sort Code Checker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      text-align: center;
      background: #fafafa;
      color: #222;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      margin-bottom: 25px;
    }

    .input-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    input {
      width: 55px;
      padding: 10px;
      font-size: 16px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      background: white;
    }

    input:focus {
      border-color: #4a90e2;
      box-shadow: 0 0 3px rgba(74,144,226,0.4);
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      margin-top: 18px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #4a90e2;
      color: white;
    }

    button:hover {
      background: #3a7ac0;
    }

    #result {
      margin-top: 30px;
    }

    .card {
      border: 1px solid #ddd;
      background: white;
      padding: 18px;
      margin-top: 20px;
      border-radius: 10px;
      text-align: left;
      display: inline-block;
      min-width: 300px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .bank {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .label {
      font-weight: bold;
    }

    .error {
      color: #a94442;
      margin-top: 20px;
    }

    .hint {
      font-size: 13px;
      color: #888;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<h1>UK Sort Code Checker</h1>
<p>Enter a 6-digit sort code using the boxes below</p>

<div class="input-box">
  <input id="part1" maxlength="2" inputmode="numeric" placeholder="12">
  <span>-</span>
  <input id="part2" maxlength="2" inputmode="numeric" placeholder="34">
  <span>-</span>
  <input id="part3" maxlength="2" inputmode="numeric" placeholder="56">
</div>

<br>

<button onclick="lookup()">Search</button>

<div class="hint">Example: 12-34-56</div>

<div id="result"></div>

<script>
let data = [];

fetch('sortcodes.csv')
  .then(response => response.text())
  .then(text => {
    const rows = text.split('\n').slice(1);

    data = rows.map(row => {
      const cols = row.split(',');

      return {
        sort_code: (cols[0] || "").trim(),
        bank: (cols[1] || "").trim(),
        branch: (cols[2] || "").trim(),
        location: (cols[3] || "").trim()
      };
    });
  });

function lookup() {
  const result = document.getElementById("result");
  result.innerHTML = "Searching...";

  const p1 = document.getElementById("part1").value.trim();
  const p2 = document.getElementById("part2").value.trim();
  const p3 = document.getElementById("part3").value.trim();

  if (!p1 || !p2 || !p3) {
    result.innerHTML = `<div class="error">Please enter all 3 parts of the sort code.</div>`;
    return;
  }

  const input = `${p1}-${p2}-${p3}`;

  const match = data.find(d => d.sort_code === input);

  if (match) {
    result.innerHTML = `
      <div class="card">
        <div class="bank">${match.bank}</div>
        <div><span class="label">Branch:</span> ${match.branch}</div>
        <div><span class="label">Location:</span> ${match.location}</div>
      </div>
    `;
  } else {
    result.innerHTML = `
      <div class="error">
        <strong>No exact match found</strong><br>
        Please check the sort code format and try again.
      </div>
    `;
  }
}

// UX enhancements (safe, unchanged logic)
function setupUX() {
  const p1 = document.getElementById("part1");
  const p2 = document.getElementById("part2");
  const p3 = document.getElementById("part3");

  [p1, p2, p3].forEach(input => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "");
    });
  });

  p1.addEventListener("input", () => {
    if (p1.value.length === 2) p2.focus();
  });

  p2.addEventListener("input", () => {
    if (p2.value.length === 2) p3.focus();
  });

  [p1, p2, p3].forEach(input => {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") lookup();
    });
  });
}

window.addEventListener("load", setupUX);
</script>

</body>
</html>
