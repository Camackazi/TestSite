<script>

let data = [];

fetch('sortcodes.csv')
  .then(r => r.text())
  .then(text => {
    const rows = text.split('\n').slice(1);

    data = rows.map(row => {
      const cols = row.split(',');

      return {
        sort: (cols[0] || "").trim(),
        bank: (cols[1] || "").trim(),
        branch: (cols[2] || "").trim(),
        location: (cols[3] || "").trim()
      };
    });
  });

function clean(input) {
  return input.replace(/[^0-9]/g, "");
}

function format(sc) {
  return sc.slice(0,2) + "-" + sc.slice(2,4) + "-" + sc.slice(4,6);
}

function lookup() {

  const result = document.getElementById("result");
  const btn = document.getElementById("searchBtn");

  result.innerHTML = "Searching...";
  btn.disabled = true;

  const raw = [
    document.getElementById("p1").value,
    document.getElementById("p2").value,
    document.getElementById("p3").value
  ].join("");

  const cleaned = clean(raw);

  if (cleaned.length !== 6) {
    result.innerHTML = `<div class="error">Please enter a full 6-digit sort code.</div>`;
    btn.disabled = false;
    return;
  }

  const formatted = format(cleaned);

  const match = data.find(x => x.sort === formatted);

  if (match) {

    result.innerHTML = `
      <div class="card">
        <div><strong>${match.bank}</strong></div>
        <div><strong>Branch:</strong> ${match.branch}</div>
        <div><strong>Location:</strong> ${match.location}</div>
      </div>
    `;

  } else {

    const similar = data
      .filter(x => x.sort.startsWith(cleaned.slice(0,2)))
      .slice(0,3);

    let html = `<div class="error"><strong>No exact match found</strong></div>`;

    if (similar.length) {
      html += `<div class="suggestion"><strong>Similar matches:</strong><br>`;
      similar.forEach(s => {
        html += `${s.sort} — ${s.bank}<br>`;
      });
      html += `</div>`;
    }

    result.innerHTML = html;
  }

  btn.disabled = false;
}

function clearAll() {
  document.getElementById("p1").value = "";
  document.getElementById("p2").value = "";
  document.getElementById("p3").value = "";
  document.getElementById("result").innerHTML = "";
}

</script>
