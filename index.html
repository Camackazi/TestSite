<script>

let data = [];
let ready = false;

fetch('sortcodes.csv')
  .then(r => r.text())
  .then(t => {

    const rows = t.split('\n').slice(1);

    data = rows.map(r => {
      const c = r.split(',');
      return {
        sort: (c[0] || "").trim(),
        bank: (c[1] || "").trim(),
        branch: (c[2] || "").trim(),
        location: (c[3] || "").trim()
      };
    });

    ready = true;

  })
  .catch(err => {
    console.error("CSV load error:", err);
  });

function clean(input) {
  return input.replace(/[^0-9]/g, '');
}

function format(sc) {
  return sc.slice(0,2) + "-" + sc.slice(2,4) + "-" + sc.slice(4,6);
}

function allFilled() {
  return (
    document.getElementById("p1").value.length === 2 &&
    document.getElementById("p2").value.length === 2 &&
    document.getElementById("p3").value.length === 2
  );
}

function lookup() {

  const r = document.getElementById("result");

  if (!ready) {
    r.innerHTML = "Loading data...";
    return;
  }

  const raw = [
    document.getElementById("p1").value,
    document.getElementById("p2").value,
    document.getElementById("p3").value
  ].join("");

  const cleaned = clean(raw);

  if (cleaned.length !== 6) {
    r.innerHTML = `<div class="error">Please enter a full 6-digit sort code.</div>`;
    return;
  }

  const formatted = format(cleaned);

  const match = data.find(x => x.sort === formatted);

  if (match) {

    r.innerHTML = `
      <div class="card">
        <div><strong>${match.bank}</strong></div><br>
        <div><strong>Branch:</strong> ${match.branch}</div>
        <div><strong>Location:</strong> ${match.location}</div>
      </div>
    `;

  } else {

    const similar = data
      .filter(x => x.sort.replace(/-/g,'').startsWith(cleaned.slice(0,2)))
      .slice(0,3);

    let html = `<div class="error"><strong>No exact match found</strong></div>`;

    if (similar.length) {
      html += `<div class="suggestion"><strong>Similar matches:</strong><br>`;
      similar.forEach(s => {
        html += `${s.sort} — ${s.bank}<br>`;
      });
      html += `</div>`;
    }

    r.innerHTML = html;
  }
}

function clearAll() {
  document.getElementById("p1").value = "";
  document.getElementById("p2").value = "";
  document.getElementById("p3").value = "";
  document.getElementById("result").innerHTML = "";
}

function setupUX() {

  const p1 = document.getElementById("p1");
  const p2 = document.getElementById("p2");
  const p3 = document.getElementById("p3");

  const inputs = [p1, p2, p3];

  inputs.forEach((input, idx) => {

    input.addEventListener("input", () => {

      input.value = input.value.replace(/\D/g, "");

      if (input.value.length === 2 && inputs[idx + 1]) {
        inputs[idx + 1].focus();
      }

      if (allFilled()) {
        lookup();
      }

    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") lookup();
    });

  });
}

window.addEventListener("load", setupUX);

</script>
