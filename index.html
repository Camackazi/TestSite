<!DOCTYPE html>
<html>
<head>
  <title>UK Sort Code Checker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      text-align: center;
    }

    input {
      width: 50px;
      padding: 10px;
      font-size: 16px;
      text-align: center;
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
      margin-top: 15px;
      cursor: pointer;
    }

    #result {
      margin-top: 30px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h1>UK Sort Code Checker</h1>

<p>Enter a sort code:</p>

<div>
  <input id="part1" maxlength="2" inputmode="numeric" placeholder="12">
  -
  <input id="part2" maxlength="2" inputmode="numeric" placeholder="34">
  -
  <input id="part3" maxlength="2" inputmode="numeric" placeholder="56">
</div>

<br>

<button onclick="lookup()">Search</button>

<div id="result"></div>

<script>
let data = [];

// Load CSV file
fetch('sortcodes.csv')
  .then(response => response.text())
  .then(text => {
    const rows = text.split('\n').slice(1);

    data = rows.map(row => {
      const cols = row.split(',');

      return {
        sort_code: (cols[0] || "").trim(),
        bank: (cols[1] || "").trim(),
        branch: (cols[2] || "").trim(),
        location: (cols[3] || "").trim()
      };
    });
  });

function lookup() {
  result.innerHTML = "Searching...";
  
  const p1 = document.getElementById("part1").value.trim();
  const p2 = document.getElementById("part2").value.trim();
  const p3 = document.getElementById("part3").value.trim();

  const result = document.getElementById("result");

  if (!p1 || !p2 || !p3) {
    result.innerHTML = "Please enter all 3 parts of the sort code.";
    return;
  }

  const input = `${p1}-${p2}-${p3}`;

  const match = data.find(d => d.sort_code === input);

  if (match) {
  result.innerHTML = `
    <div style="
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 20px;
      border-radius: 8px;
      text-align: left;
      display: inline-block;
      min-width: 280px;
    ">
      <h2 style="margin-top:0;">${match.bank}</h2>
      <p><strong>Branch:</strong> ${match.branch}</p>
      <p><strong>Location:</strong> ${match.location}</p>
    </div>
  `;
} else {
  result.innerHTML = `
    <h3>No exact match found</h3>
    <p>We couldn't find a bank for <strong>${input}</strong>.</p>
    <p>Please check:</p>
    <ul style="text-align:left; display:inline-block;">
      <li>Each box contains 2 digits</li>
      <li>No missing numbers</li>
      <li>Try re-entering the sort code carefully</li>
    </ul>
  `;
}
}

/* ===== UX IMPROVEMENTS ===== */

function setupUX() {
  const p1 = document.getElementById("part1");
  const p2 = document.getElementById("part2");
  const p3 = document.getElementById("part3");

  // Only allow numbers
  [p1, p2, p3].forEach(input => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "");
    });
  });

  // Auto-move between boxes
  p1.addEventListener("input", () => {
    if (p1.value.length === 2) p2.focus();
  });

  p2.addEventListener("input", () => {
    if (p2.value.length === 2) p3.focus();
  });

  // Press Enter to search
  [p1, p2, p3].forEach(input => {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        lookup();
      }
    });
  });
}

// Run UX setup when page loads
window.addEventListener("load", setupUX);
</script>

</body>
</html>
