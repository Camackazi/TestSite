<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UK Sort Code Checker | Instant Lookup Tool</title>

  <meta name="description" content="Free UK sort code checker. Find bank, branch and location details instantly from a 6-digit sort code.">

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      text-align: center;
      background: #fafafa;
      color: #222;
      padding: 0 15px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 10px;
    }

    .status {
      font-size: 13px;
      margin-bottom: 20px;
      color: #999;
    }

    .input-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    input {
      width: 55px;
      padding: 10px;
      font-size: 16px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      background: white;
      transition: 0.2s;
    }

    input.filled {
      border-color: #4a90e2;
      box-shadow: 0 0 4px rgba(74,144,226,0.3);
    }

    input:disabled {
      background: #f0f0f0;
      cursor: not-allowed;
    }

    button {
      padding: 10px 18px;
      font-size: 15px;
      margin: 12px 5px 0 5px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #4a90e2;
      color: white;
    }

    button:hover {
      background: #3a7ac0;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #result {
      margin-top: 30px;
    }

    .card {
      border: 1px solid #ddd;
      background: white;
      padding: 18px;
      margin-top: 20px;
      border-radius: 10px;
      text-align: left;
      display: inline-block;
      min-width: 300px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .bank {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .label {
      font-weight: bold;
    }

    .error {
      color: #a94442;
      margin-top: 20px;
    }

    .footer {
      margin-top: 60px;
      font-size: 12px;
      color: #888;
    }

  </style>

</head>

<body>

<h1>UK Sort Code Checker</h1>
<div class="subtitle">Instant bank, branch and location lookup</div>

<div id="status" class="status">Loading data...</div>

<p>Enter a 6-digit sort code</p>

<div class="input-box">
  <input id="part1" maxlength="2" inputmode="numeric" disabled placeholder="12">
  <span>-</span>
  <input id="part2" maxlength="2" inputmode="numeric" disabled placeholder="34">
  <span>-</span>
  <input id="part3" maxlength="2" inputmode="numeric" disabled placeholder="56">
</div>

<br>

<button id="searchBtn" onclick="lookup()" disabled>Search</button>
<button onclick="clearAll()">Clear</button>

<div id="result"></div>

<div class="footer">
  <p>Informational tool only — verify with official sources where required.</p>
</div>

<script>

let data = [];
let dataReady = false;

const statusEl = document.getElementById("status");
const inputs = [
  document.getElementById("part1"),
  document.getElementById("part2"),
  document.getElementById("part3")
];

const btn = document.getElementById("searchBtn");

fetch('sortcodes.csv')
  .then(response => {
    if (!response.ok) throw new Error("CSV failed to load");
    return response.text();
  })
  .then(text => {

    const rows = text.split('\n').slice(1);

    data = rows.map(row => {
      const cols = row.split(',');

      return {
        sort_code: (cols[0] || "").trim(),
        bank: (cols[1] || "").trim(),
        branch: (cols[2] || "").trim(),
        location: (cols[3] || "").trim()
      };
    });

    dataReady = true;

    statusEl.textContent = "Data loaded — ready";
    statusEl.style.color = "#4a90e2";

    inputs.forEach(i => i.disabled = false);
    btn.disabled = false;

  })
  .catch(err => {
    statusEl.textContent = "Error loading data — check CSV file";
    statusEl.style.color = "red";
    console.error(err);
  });

function allFilled() {
  return inputs.every(i => i.value.length === 2);
}

function lookup() {

  if (!dataReady) return;

  const result = document.getElementById("result");

  result.innerHTML = "Searching...";
  btn.disabled = true;

  const p1 = inputs[0].value.trim();
  const p2 = inputs[1].value.trim();
  const p3 = inputs[2].value.trim();

  if (!p1 || !p2 || !p3) {
    result.innerHTML = `<div class="error">Please complete all 3 boxes.</div>`;
    btn.disabled = false;
    return;
  }

  const input = `${p1}-${p2}-${p3}`;

  const match = data.find(d => d.sort_code === input);

  if (match) {
    result.innerHTML = `
      <div class="card">
        <div class="bank">${match.bank}</div>
        <div><span class="label">Branch:</span> ${match.branch}</div>
        <div><span class="label">Location:</span> ${match.location}</div>
      </div>
    `;
  } else {
    result.innerHTML = `<div class="error">No match found</div>`;
  }

  btn.disabled = false;
}

function clearAll() {
  inputs.forEach(i => i.value = "");
  document.getElementById("result").innerHTML = "";
  inputs[0].focus();
}

function setupUX() {

  inputs.forEach((input, idx) => {

    input.addEventListener("input", () => {

      input.value = input.value.replace(/\D/g, "");

      input.classList.toggle("filled", input.value.length === 2);

      if (input.value.length === 2 && inputs[idx + 1]) {
        inputs[idx + 1].focus();
      }

      if (allFilled() && dataReady) {
        lookup();
      }

    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") lookup();
    });

  });
}

window.addEventListener("load", setupUX);

</script>

</body>
</html>
